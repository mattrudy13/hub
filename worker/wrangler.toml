name = "hub-daily-cron"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Cron only: no workers.dev URL, so the Worker can't be called from outside.
workers_dev = false

[triggers]
# Every hour at :20 and :50 (UTC). Which workflows start when is decided in src/index.js, in ET.
crons = ["20,50 * * * *"]

# The GitHub token is a secret, not a var. Set it with:
#   npx wrangler secret put GITHUB_TOKEN

# Keep each run's logs (3 days on the free plan), so a failed dispatch shows GitHub's error in the dashboard.
[observability]
enabled = true
