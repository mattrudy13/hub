<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rudy's Board</title>
  <meta name="description" content="Rudy's apps at a glance: tonight's picks, season records and what changed lately.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply a saved theme before the page paints, so a visitor who picked one doesn't see a flash of the other.
    try { const t = localStorage.getItem("hub:theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="ticker" id="ticker" role="region" aria-label="Recently updated" hidden>
    <span class="ticker-label"><span class="sb">Latest</span><span class="ar">NEWS</span></span>
    <div class="ticker-window"><div class="ticker-track"></div></div>
    <button type="button" class="ticker-pause" id="ticker-pause" aria-label="Pause the ticker" aria-pressed="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg>
    </button>
  </div>

  <div class="wrap">
    <header class="masthead">
      <div>
        <h1>Rudy's Board</h1>
        <p id="subline">&nbsp;</p>
      </div>
      <div class="controls">
        <a class="link-btn" href="daily.html"><span class="sb">Daily<span class="arr"> →</span></span><span class="ar">DAILY ▶</span></a>
        <a class="link-btn" href="homebase.html"><span class="sb">Home Base<span class="arr"> →</span></span><span class="ar">HOME ▶</span></a>
        <button type="button" class="arcade-btn" id="arcade" aria-pressed="false"><span class="sb">▶ Arcade<span class="arr"> mode</span></span><span class="ar">EXIT ARCADE</span></button>
        <button type="button" class="icon-btn" id="theme" aria-label="Switch theme">
          <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
          <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" hidden><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        </button>
      </div>
    </header>

    <main>
      <div class="tiles" id="tiles"></div>
    </main>

    <footer class="foot"><span class="sb">Every tile reads its app's own published data.</span><span class="ar">GAME OVER? INSERT COIN AND RELOAD.</span></footer>
  </div>

  <script src="common.js"></script>
  <script src="tiles.js"></script>
  <script src="feed.js"></script>
  <script>
    setupToggles();
    renderTiles();
    renderFeed();
  </script>
</body>
</html>
