name: Update daily data

on:
  schedule:
    # Hourly from 6 AM to midnight Eastern in daylight time (10:20–04:20 UTC); 5 AM to 11 PM in winter.
    # GitHub skips many of these, so the hub-daily-cron Worker (worker/) also dispatches the workflow at
    # the same times; this schedule stays as a fallback. The page shows when each file was last updated.
    - cron: "20 0-4,10-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Check out the branch tip, not the commit that triggered the run: a run that waited in the
      # concurrency queue would otherwise build on stale data and conflict on push.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Each step runs even if an earlier one failed, so a news outage doesn't hold back the scores.
      - name: News
        id: news
        continue-on-error: true
        run: node scripts/news.mjs
      - name: Upsets
        id: upsets
        continue-on-error: true
        run: node scripts/upsets.mjs
      - name: YouTube
        id: youtube
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/youtube.mjs
      - name: Commit if changed
        run: |
          # `updated` changes on every run, so ignore it when deciding whether anything changed.
          node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");
            const changed = execSync("git ls-files --modified --others --exclude-standard -- data").toString().split("\n").filter(Boolean);
            const strip = (s) => s.replace(/"updated":\s*"[^"]*",?/g, "");
            const real = changed.some((f) => {
              let old = "";
              try { old = execSync(`git show HEAD:${f}`, { maxBuffer: 64 << 20 }).toString(); } catch { return true; }
              return strip(old) !== strip(fs.readFileSync(f, "utf8"));
            });
            fs.writeFileSync(process.env.GITHUB_ENV, `DATA_CHANGED=${real}\n`, { flag: "a" });
          '
      - name: Push
        if: env.DATA_CHANGED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore(data): refresh daily data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q
          git push
      # Fail the run (GitHub emails) after pushing whatever did work.
      - name: Report failures
        if: steps.news.outcome == 'failure' || steps.upsets.outcome == 'failure' || steps.youtube.outcome == 'failure'
        run: |
          echo "news=${{ steps.news.outcome }} upsets=${{ steps.upsets.outcome }} youtube=${{ steps.youtube.outcome }}"
          exit 1
